name: orthophoto
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/ortho.py', '.github/workflows/ortho.yml']
permissions:
  contents: write
jobs:
  ortho:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow requests
      - run: python pipeline/ortho.py
      - name: commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ortho*.jpg
          git commit -m "Orthophoto textures (RLP DOP20, dl-de/by-2.0)" || echo "nothing to commit"
          git pull --rebase && git push
